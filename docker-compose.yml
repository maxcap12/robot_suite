services:
    tello_suite:
        image: robot_suite:tello
        container_name: tello_suite
        build:
            context: .
            dockerfile: ./docker/tello/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
        devices:
            - /dev/snd:/dev/snd # for audio access
        network_mode: "host"
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup tello_launch.py"
    spot_suite:
        image: robot_suite:spot
        container_name: spot_suite
        build:
            context: .
            dockerfile: ./docker/spot/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
        devices:
            - /dev/snd:/dev/snd
        network_mode: "host"
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup spot_launch.py"
    go1_suite:
        image: robot_suite:go1
        container_name: go1_suite
        build:
            context: .
            dockerfile: ./docker/go1/Dockerfile
        environment:
            - DISPLAY=${DISPLAY}
            - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
            - FASTDDS_BUILTIN_TRANSPORTS=UDPv4 # avoid shared-memory issues with other containers
            - XAUTHORITY=/root/.Xauthority
            #- RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
        volumes:
            - /tmp/.X11-unix:/tmp/.X11-unix
            # X11 cookie of the host session: lets the GUI (control station) open without `xhost`.
            # Falls back to /dev/null (no cookie) if XAUTHORITY is unset -> then run `xhost +local:docker`.
            - ${XAUTHORITY:-/dev/null}:/root/.Xauthority:ro
            - /dev:/dev # RealSense (USB, hot-plug)
        privileged: true # needed for the RealSense USB access
        network_mode: "host"
        ipc: host
        tty: true
        stdin_open: true
        command: "ros2 launch robot_bringup go1_launch.py"
