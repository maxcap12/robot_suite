# Parameters for the Unitree Go1 platform (ros2 launch robot_bringup go1_launch.py)
#
# The Go1 itself is driven by the unitree_ros driver (https://github.com/snt-arg/unitree_ros),
# started by go1_launch.py with its own params (drivers/unitree_ros/config/params.yaml). It listens to:
#   - /cmd_vel     geometry_msgs/Twist
#   - /stand_up    std_msgs/Empty
#   - /stand_down  std_msgs/Empty
#
# Images come from an Intel RealSense (realsense2_camera), published on
# /camera/camera/color/image_raw. Change the topics below if you use another camera.

landmark_detector_node:
    ros__parameters:
        standalone: false
        tick_rate: 30 # Hz
        img_input_topic: "/camera/camera/color/image_raw"
        landmarks_topic: "/hand/landmarks"
        num_hands: 2
        min_detection_confidence: 0.5
        min_tracking_confidence: 0.5

landmark_annotator_node:
    ros__parameters:
        img_input_topic: "/camera/camera/color/image_raw"
        landmarks_topic: "/hand/landmarks"
        annotated_img_topic: "/hand/annotated/image"

bt_server:
    ros__parameters:
        bt_name: go1_bt
        tick_freq: 60 # Hz
        stop_on_failure: false

# Control station (pygame window): used to switch modes (h = hand, m = manual)
# and to drive the robot with the keyboard in manual mode.
remote_controller:
    ros__parameters:
        accepted_keys: "w a s d t l q m h f"
        accepted_mods: []
        matching_keys: []
        cmd_topic_name: "/cmd_vel"
        key_pressed_topic_name: "/key_pressed"
        battery_level_topic_name: "/flight_data" # unused on Go1
        cam_image_topic_name: "/camera/camera/color/image_raw"
        takeoff_topic_name: "/stand_up" # `t` key -> stand up
        land_topic_name: "/stand_down" # `l` key -> stand down
